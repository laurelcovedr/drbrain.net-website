name: Validate isolated public candidate
on:
  pull_request:
    paths: ['public-candidate/**', 'drbrainnet/lib/yiwei-data.ts', 'drbrainnet/lib/yiwei-faq.ts', '.github/workflows/public-candidate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node public-candidate/build.mjs
      - run: python public-candidate/validate.py
      - run: python public-candidate/test.py
      - run: npm ci --prefix public-candidate --ignore-scripts
      - run: npx --prefix public-candidate playwright install --with-deps chromium
      - run: npm run test:browser --prefix public-candidate
      - name: Save isolated candidate screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-candidate-browser-review
          path: public-candidate/browser-results/
          if-no-files-found: warn
          retention-days: 14
