name: Full trilingual site mobile QA
on:
  pull_request:
    paths:
      - 'drbrainnet/**'
      - '.github/workflows/full-site-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: drbrainnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node scripts/run-mobile-qa.cjs
        env:
          QA_OUTPUT: asset-notes/mobile-qa-ci
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-site-mobile-qa
          path: drbrainnet/asset-notes/mobile-qa-ci
