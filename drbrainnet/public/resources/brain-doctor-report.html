</style></head><body><noscript><section class="page"><h1>AI Brain Health &amp; Longevity Report</h1><p>This interactive sample requires JavaScript. <a href="/reports/brain-health">Explore the current Brain Health Report</a> or <a href="/resources/brain-health-report.pdf">open the original English PDF</a>.</p></section></noscript><nav class="toolbar" aria-label="Report controls"><a href="/reports/brain-doctor">Dr.Brain™ report explorer</a><button id="print">Print / Save PDF</button><label class="upload">Load JSON<input id="import" type="file" accept=".json,application/json" hidden></label><small id="status" role="status">Case 001 · Draft for clinician review</small></nav><main id="report"></main><script>
const DEFAULT_DATA={"schema_version": "1.0", "report_id": "DEMO-001", "review_status": "draft", "patient": {"display_name": "Case 001 (de-identified)", "age_years": 59, "sex": "Male"}, "scan_date": "2026-03-20", "model": {"name": "Dr.Brain (source report)", "version": null, "scanner": null, "quality_review": null}, "brain_age": {"status": "assessed", "predicted_years": 55.7, "prediction_interval": null}, "cognition": {"status": "assessed", "source_classification": "Low risk", "rows": [{"structure": "Left hippocampus", "volume_ml": 3.49, "icv_pct": 0.22, "reference_pct": [0.17, 0.22]}, {"structure": "Right hippocampus", "volume_ml": 3.96, "icv_pct": 0.25, "reference_pct": [0.2, 0.25]}, {"structure": "Left parahippocampal region", "volume_ml": 3.25, "icv_pct": 0.2, "reference_pct": [0.16, 0.21]}, {"structure": "Right parahippocampal region", "volume_ml": 3.2, "icv_pct": 0.2, "reference_pct": [0.17, 0.2]}, {"structure": "Left entorhinal region", "volume_ml": 2.45, "icv_pct": 0.15, "reference_pct": [0.12, 0.16]}, {"structure": "Right entorhinal region", "volume_ml": 2.65, "icv_pct": 0.17, "reference_pct": [0.12, 0.16]}, {"structure": "Right lateral ventricle", "volume_ml": 12.61, "icv_pct": 0.8, "reference_pct": [0.2, 0.71]}]}, "ventricles": {"status": "assessed", "rows": [{"structure": "Left lateral ventricle", "volume_ml": 13.96, "icv_pct": 0.88, "reference_pct": [0.18, 0.99]}, {"structure": "Right lateral ventricle", "volume_ml": 12.61, "icv_pct": 0.8, "reference_pct": [0.2, 0.71]}, {"structure": "Third ventricle", "volume_ml": 1.07, "icv_pct": 0.07, "reference_pct": [0.03, 0.07]}, {"structure": "Fourth ventricle", "volume_ml": 1.56, "icv_pct": 0.1, "reference_pct": [0.06, 0.13]}]}, "cerebellum": {"status": "assessed", "rows": [{"structure": "Left cerebellar white matter", "volume_ml": 13.24, "icv_pct": 0.84, "reference_pct": [0.65, 0.94]}, {"structure": "Right cerebellar white matter", "volume_ml": 12.56, "icv_pct": 0.79, "reference_pct": [0.6, 0.88]}, {"structure": "Left cerebellar cortex", "volume_ml": 43.83, "icv_pct": 2.77, "reference_pct": [2.3, 3.18]}, {"structure": "Right cerebellar cortex", "volume_ml": 44.22, "icv_pct": 2.79, "reference_pct": [2.31, 3.13]}, {"structure": "Total cerebellum", "volume_ml": 113.86, "icv_pct": 7.19, "reference_pct": [5.85, 8.13]}]}, "wmh": {"status": "assessed", "volume_ml": 1.64, "lesion_count": 22, "fazekas": 1, "source_icv_pct": 0.0978, "lesion_range_ml": [0.02, 0.34], "distribution_pct": {"Cortical white matter": 44.59, "Deep white matter": 55.41, "Periventricular": 0, "Infratentorial": 0}}, "aneurysm": {"status": "assessed", "candidate_count": 0, "sequence_verified": null}, "microbleeds": {"status": "assessed", "candidate_count": 0, "sequence_verified": null}, "global": {"status": "assessed", "icv_ml": 1584.62, "rows": [{"structure": "Grey matter", "volume_ml": 696.19, "icv_pct": 43.93, "reference_pct": [36.89, 45.53]}, {"structure": "White matter", "volume_ml": 627.03, "icv_pct": 39.57, "reference_pct": [31.17, 41.22]}, {"structure": "Cerebrospinal fluid", "volume_ml": 261.4, "icv_pct": 16.5, "reference_pct": [13.95, 31.07]}]}, "clinician": {"name": null, "approval_date": null, "plan": null}, "images": [], "source_review": {"document": "AI Brain Health & Longevity Report (supplied English PDF)", "pdf_url": "/resources/brain-doctor-source.pdf", "primary_age_values": {"chronological_years": 59.0, "predicted_years": 55.7}, "age_graphic_conflict": {"graphic_chronological_years": 62.0, "graphic_predicted_years": 54.1, "resolution": "Case identity, executive summary and module narrative agree on 59.0 and 55.7. The decorative graphic uses different values."}, "clinical_release": "Draft; clinician review and source reconciliation required."}};
const esc=x=>String(x??'Not supplied').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'Not supplied';
const box=(title,text,flag=false)=>`<div class="box ${flag?'flag':''}"><h3>${esc(title)}</h3>${text}</div>`;
const metric=(label,value)=>`<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;
const assessed=m=>m?.status==='assessed';
const above=r=>r.icv_pct<r.reference_pct[0]||r.icv_pct>r.reference_pct[1];
const table=rows=>`<div class="table-wrap"><table><thead><tr><th>Structure</th><th>Volume (mL)</th><th>ICV (%)</th><th>Source reference (%)</th></tr></thead><tbody>${rows.map(r=>`<tr class="${above(r)?'outside':''}"><td>${esc(r.structure)}</td><td>${num(r.volume_ml)}</td><td>${num(r.icv_pct)}${above(r)?' *':''}</td><td>${num(r.reference_pct[0])}–${num(r.reference_pct[1])}</td></tr>`).join('')}</tbody></table></div><p class="table-note">* Outside the supplied reference interval. ICV = intracranial volume. Reference intervals are model-specific.</p>`;
function validate(d){if(!d||d.schema_version!=='1.0'||!d.patient||!Number.isFinite(d.patient.age_years)||d.patient.age_years<0||typeof d.scan_date!=='string')throw Error('Invalid report identity or schema.');for(const k of ['brain_age','cognition','ventricles','cerebellum','wmh','aneurysm','microbleeds','global']){const m=d[k];if(!m||!['assessed','not_assessed','unavailable','failed'].includes(m.status))throw Error('Invalid module status: '+k);if(!assessed(m))continue;if(['cognition','ventricles','cerebellum','global'].includes(k)){if(!Array.isArray(m.rows)||!m.rows.every(r=>typeof r.structure==='string'&&Number.isFinite(r.volume_ml)&&r.volume_ml>=0&&Number.isFinite(r.icv_pct)&&r.icv_pct>=0&&Array.isArray(r.reference_pct)&&r.reference_pct.length===2&&r.reference_pct.every(Number.isFinite)&&r.reference_pct[0]<=r.reference_pct[1]))throw Error('Invalid measurements: '+k);}if(k==='brain_age'&&(!Number.isFinite(m.predicted_years)||m.predicted_years<0))throw Error('Invalid brain age');if(['aneurysm','microbleeds'].includes(k)&&(!Number.isInteger(m.candidate_count)||m.candidate_count<0))throw Error('Invalid candidate count');if(k==='wmh'&&(!Number.isFinite(m.volume_ml)||m.volume_ml<0||!Number.isInteger(m.lesion_count)||m.lesion_count<0||Object.values(m.distribution_pct||{}).some(v=>!Number.isFinite(v)||v<0||v>100)))throw Error('Invalid white-matter measurements');}return d;}
function renderReport(input){const d=validate(input),pages=[];const add=(id,title,sub,body)=>pages.push({id,title,sub,body});const absent=m=>box('Module status',`${esc(m.status)}. No disease conclusion is available.`);const value=(m,key,unit='')=>assessed(m)?m[key]+unit:'Not assessed';const gap=assessed(d.brain_age)?d.brain_age.predicted_years-d.patient.age_years:null;const w=d.wmh;const calc=assessed(w)&&assessed(d.global)&&d.global.icv_ml>0?w.volume_ml/d.global.icv_ml*100:null;
add('overview','AI Brain Health & Longevity','MRI-based brain health assessment for longevity and brain health clinics',`<div class="meta"><b>${esc(d.patient.display_name)}</b><span>${esc(d.patient.sex)} · ${esc(d.patient.age_years)} years</span><span>Scan: ${esc(d.scan_date)}</span></div><span class="badge">Draft for clinician review</span><div class="metrics overview-metrics">${metric('Chronological age',num(d.patient.age_years,1)+' years')}${metric('AI-estimated brain age',value(d.brain_age,'predicted_years',' years'))}${metric('Brain-age gap',gap===null?'Not assessed':num(gap,1)+' years')}${metric('WMH volume',value(w,'volume_ml',' mL'))}</div><h2>Results at a glance</h2><table><tr><th>Imaging domain</th><th>Source measurements</th></tr>${[['Cognition-related structure',assessed(d.cognition)?d.cognition.rows.length+' regions':'Not assessed'],['Ventricular structure',assessed(d.ventricles)?d.ventricles.rows.length+' regions':'Not assessed'],['Cerebellar structure',assessed(d.cerebellum)?d.cerebellum.rows.length+' regional measurements':'Not assessed'],['White-matter findings',value(w,'lesion_count',' lesion candidates')],['Aneurysm candidates',value(d.aneurysm,'candidate_count')],['Microbleed candidates',value(d.microbleeds,'candidate_count')]].map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>${box('Clinical context','Source measurements support clinical review. No new image processing, composite health score or disease diagnosis has been performed.')}<div class="report-module-links">${[['aging','Brain aging'],['cognition','Cognition'],['ventricles','Ventricles'],['cerebellum','Cerebellum'],['wmh','White matter'],['vascular','Vascular'],['review','Clinical review']].map(([id,label])=>`<a href="#${id}">${label}</a>`).join('')}</div>`);
add('aging','AI Brain Age','Chronological age and MRI-derived model estimate',assessed(d.brain_age)?`<div class="metrics">${metric('Chronological age',num(d.patient.age_years,1)+' years')}${metric('Predicted brain age',num(d.brain_age.predicted_years,1)+' years')}${metric('Predicted − chronological',num(gap,1)+' years')}</div>${[['Chronological age',d.patient.age_years],['AI-estimated brain age',d.brain_age.predicted_years]].map(([label,n])=>`<div class="age-row"><span>${esc(label)}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,n))}%"></i></div><b>${num(n,1)}</b></div>`).join('')}<p class="table-note">Shared visual scale: 0–100 years.</p>${box('Interpretation','A lower model estimate alone does not establish better cognition, lower dementia risk or biological rejuvenation. A brain-age estimate is not a lifespan forecast.')}${d.source_review?.age_graphic_conflict?box('Source reconciliation','The supplied age artwork uses 62.0 / 54.1 years. Its case identity, executive summary and module narrative agree on 59.0 / 55.7 years. This report uses the narrative values.',true):''}${box('Model information',`Model version: ${esc(d.model?.version)}. Prediction interval: ${esc(d.brain_age.prediction_interval)}. Bias correction and international calibration were not supplied.`)}`:absent(d.brain_age));
add('cognition','Cognition-Related Structure','Regional measurements and source reference intervals',assessed(d.cognition)?`${table(d.cognition.rows)}${box('Regions requiring review',d.cognition.rows.filter(above).map(r=>esc(r.structure)+': '+num(r.icv_pct)+'%').join('<br>')||'No measurements outside the supplied intervals.',true)}${box('Source classification',`${esc(d.cognition.source_classification)}. This source label has not been independently validated. Volumetry alone cannot diagnose Alzheimer’s disease or exclude cognitive impairment.`)}`:absent(d.cognition));
add('ventricles','Ventricular Measurements','Ventricular structure and clinical correlation',assessed(d.ventricles)?`${table(d.ventricles.rows)}${box('Measurement review','Review any flagged measurement, ventricular configuration and segmentation against the source MRI.',true)}${box('Clinical scope','These measurements do not establish hydrocephalus. Evans index, callosal angle and DESH assessment were not supplied.')}`:absent(d.ventricles));
add('cerebellum','Cerebellar Structure','Quantitative regional baseline',assessed(d.cerebellum)?`${table(d.cerebellum.rows)}${box('Source interval review',d.cerebellum.rows.filter(above).length+' measured regions outside the source intervals. Measurements within range do not exclude movement disorders or other neurological conditions.')}${box('Clinical correlation','Review coordination, balance, gait, symptoms and neurological examination when indicated.')}`:absent(d.cerebellum));
add('wmh','White-Matter Findings','WMH burden, distribution and source normalization',assessed(w)?`<div class="metrics">${metric('WMH volume',num(w.volume_ml)+' mL')}${metric('Lesion candidates',w.lesion_count)}${metric('Source Fazekas grade',w.fazekas??'Not supplied')}</div><h2>Source distribution of WMH volume</h2>${Object.entries(w.distribution_pct||{}).map(([label,n])=>`<div class="distribution"><span>${esc(label)}</span><div class="bar"><i style="width:${n}%"></i></div><b>${num(n)}%</b></div>`).join('')}${box('Normalization review',`Source WMH / ICV: ${num(w.source_icv_pct,4)}%. Recalculated from supplied volume and ICV: ${num(calc,4)}%. Verify the denominator and retain both values.`,true)}${box('Clinical scope','WMH have several possible causes. Source grading and lesion candidates require image verification. These findings alone do not establish small vessel disease.')}`:absent(w));
add('vascular','Vascular Candidates','Sequence-specific findings for human review',`<div class="two">${['aneurysm','microbleeds'].map(k=>box(k==='aneurysm'?'Aneurysm candidates':'Microbleed candidates',`<div class="metrics">${metric('Source-reported candidates',value(d[k],'candidate_count'))}</div><p>${k==='aneurysm'?'Confirm MRA acquisition and radiologist review.':'Confirm susceptibility-sensitive imaging and human review.'}</p><p>Sequence verification: ${esc(d[k].sequence_verified)}</p>`)).join('')}</div>${box('Interpretation','Zero AI-reported candidates does not guarantee absence of disease. Confirm module coverage and acquisition quality.')}${box('Scope','These source outputs do not establish an acute-stroke, tumor or psychiatric diagnosis.')}`);
add('review','Clinical Review & Source Checks','A traceable review before clinical release',`<ol class="review-steps"><li>Verify MRI quality, sequence coverage and model version.</li><li>Review segmentation and source reference intervals.</li><li>Reconcile any source discrepancies.</li><li>Integrate clinical history and validated cognitive assessment before release.</li></ol><h2>Source review log</h2><table><tr><th>Review item</th><th>Recorded status</th></tr><tr><td>Age values</td><td>${d.source_review?.age_graphic_conflict?'Narrative values retained; decorative graphic requires correction.':'No graphic reconciliation note supplied.'}</td></tr><tr><td>Regional intervals</td><td>${['cognition','ventricles'].filter(k=>assessed(d[k])).map(k=>esc(k)+': '+d[k].rows.filter(above).length+' outside-range measurements').join('<br>')}</td></tr><tr><td>WMH / ICV</td><td>Source ${num(w.source_icv_pct,4)}%; recalculated ${num(calc,4)}%. Denominator review required.</td></tr><tr><td>Clinician / approval date</td><td>${esc(d.clinician?.name)} / ${esc(d.clinician?.approval_date)}</td></tr><tr><td>Report ID / model version</td><td>${esc(d.report_id)} / ${esc(d.model?.version)}</td></tr></table>${box('Release status','Clinician approval and an individualized care plan were not supplied. This sample remains a draft. Source artwork labels do not establish clinical verification.',true)}<p class="table-note">Adapted from supplied English report material and sample measurements. No new MRI processing was performed.</p>`);
document.getElementById('report').innerHTML=pages.map((p,i)=>`<section class="page" id="${p.id}"><div class="brand"><b>Dr.Brain™ / YIWEI MEDICAL</b><span>DE-IDENTIFIED SAMPLE</span></div><h1>${p.title}</h1><div class="subtitle">${p.sub}</div>${p.body}<footer><span>AI-assisted imaging analysis · Clinical review required</span><span>${i+1} / ${pages.length}</span></footer></section>`).join('');return pages;}
window.renderReport=renderReport;window.validateReport=validate;renderReport(DEFAULT_DATA);
document.getElementById('print').onclick=()=>window.print();document.getElementById('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>1000000)throw Error('JSON file exceeds 1 MB');renderReport(JSON.parse(await f.text()));document.getElementById('status').textContent='JSON loaded · Draft for clinician review';}catch(err){document.getElementById('status').textContent='Import failed: '+err.message;}finally{e.target.value='';}};
</script></body></html>
